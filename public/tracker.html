<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>面试备考追踪器</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap");

      :root {
        color-scheme: light;
        --bg: #f3f0e8;
        --bg-grid: rgba(18, 20, 23, 0.035);
        --panel: #fffdf8;
        --panel-soft: #f8f5ee;
        --line: #d7d1c3;
        --line-strong: #c6bead;
        --text: #121417;
        --text-soft: #66717f;
        --brand: #1456ff;
        --brand-soft: rgba(20, 86, 255, 0.1);
        --ok: #0f9a72;
        --ok-soft: rgba(15, 154, 114, 0.12);
        --warn: #ef7f2d;
        --radius: 24px;
        --shadow: 0 24px 64px rgba(18, 20, 23, 0.08);
        --shadow-soft: 0 10px 24px rgba(18, 20, 23, 0.05);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          linear-gradient(var(--bg-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
          linear-gradient(180deg, #f7f4ed 0%, var(--bg) 100%);
        background-size: 24px 24px, 24px 24px, auto;
        color: var(--text);
      }

      button, input { font: inherit; }

      .shell { width: min(1200px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 80px; }
      .hero {
        display: grid;
        gap: 20px;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,245,238,.94));
        box-shadow: var(--shadow);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: rgba(20, 86, 255, 0.04);
        font-size: 12px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--text-soft);
      }
      h1 {
        margin: 16px 0 0;
        font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
        font-size: clamp(34px,5vw,60px);
        line-height: 1.02;
        letter-spacing: -.05em;
      }
      .hero p { margin: 16px 0 0; max-width: 60ch; line-height: 1.8; color: var(--text-soft); }
      .hero-panel { display: grid; gap: 14px; }
      .panel-card {
        padding: 18px 18px 20px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: var(--shadow-soft);
      }
      .panel-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-soft); }
      .panel-value { margin-top: 8px; font-size: 34px; font-weight: 700; letter-spacing: -.04em; }
      .progress-track { width: 100%; height: 10px; margin-top: 14px; border-radius: 999px; background: #ebe6db; overflow: hidden; }
      .progress-bar { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand), #2f82ff); }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      .control-button, .remember-button, .phase-chip {
        border: 1px solid var(--line-strong);
        background: rgba(255,255,255,.8);
        color: var(--text);
      }
      .control-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: 180ms ease;
        box-shadow: var(--shadow-soft);
      }
      .control-button:hover, .phase-chip:hover, .remember-button:hover { border-color: #a59b86; background: #ffffff; }
      .control-button.active { border-color: rgba(20,86,255,.24); background: var(--brand-soft); color: var(--brand); }
      .summary-strip {
        position: relative;
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-top: 22px;
        padding: 10px 0 0;
      }
      .summary-strip::before {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        top: 36px;
        height: 2px;
        background: linear-gradient(90deg, rgba(18,20,23,.12), rgba(20,86,255,.26), rgba(18,20,23,.12));
      }
      .phase-chip {
        width: 100%;
        position: relative;
        z-index: 1;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 22px;
        text-align: left;
        cursor: pointer;
        transition: 180ms ease;
      }
      .phase-chip-shell {
        padding: 0 14px 18px;
        border-radius: 24px;
        border: 1px solid transparent;
        background: transparent;
        transition: 180ms ease;
      }
      .phase-chip:hover .phase-chip-shell {
        border-color: var(--line);
        background: rgba(255,255,255,.58);
      }
      .phase-chip-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .phase-chip-marker {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 14px;
        border-radius: 18px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--text-soft);
        font-weight: 700;
        box-shadow: 0 0 0 8px var(--bg);
      }
      .phase-chip-step { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-soft); }
      .phase-chip-title { margin-top: 10px; font-size: 18px; line-height: 1.4; }
      .phase-chip-meta { margin-top: 12px; font-size: 13px; color: var(--text-soft); }
      .phase-chip.is-current .phase-chip-shell {
        border-color: color-mix(in srgb, var(--stage-accent, var(--brand)) 24%, white);
        background: color-mix(in srgb, var(--stage-accent, var(--brand)) 8%, white);
      }
      .phase-chip.is-current .phase-chip-marker {
        border-color: color-mix(in srgb, var(--stage-accent, var(--brand)) 35%, white);
        background: color-mix(in srgb, var(--stage-accent, var(--brand)) 10%, white);
        color: var(--stage-accent, var(--brand));
      }
      .phase-chip.is-complete .phase-chip-marker {
        border-color: rgba(107,226,183,.28);
        background: var(--ok-soft);
        color: var(--ok);
      }
      .roadmap {
        position: relative;
        display: grid;
        gap: 22px;
        margin-top: 28px;
        padding-left: 74px;
      }
      .roadmap::before {
        content: "";
        position: absolute;
        left: 30px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(180deg, rgba(18,20,23,.22), rgba(18,20,23,.1), rgba(18,20,23,.22));
      }
      .phase {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        overflow: hidden;
        box-shadow: var(--shadow-soft);
      }
      .phase::after {
        content: "";
        position: absolute;
        left: -58px;
        top: 36px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 2px solid color-mix(in srgb, var(--stage-accent, var(--brand)) 35%, white);
        background: var(--panel);
        box-shadow: 0 0 0 10px var(--bg);
      }
      .phase::before {
        content: "";
        position: absolute;
        left: 0; top: 0;
        width: 4px; height: 100%;
        background: linear-gradient(180deg, var(--stage-accent, var(--brand)), color-mix(in srgb, var(--stage-accent, var(--brand)) 65%, white));
      }
      .phase.is-current {
        border-color: color-mix(in srgb, var(--stage-accent, var(--brand)) 22%, white);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--stage-accent, var(--brand)) 12%, white), 0 18px 44px rgba(18,20,23,.09);
      }
      .phase.is-current::after {
        border-color: color-mix(in srgb, var(--stage-accent, var(--brand)) 50%, white);
        background: var(--stage-accent, var(--brand));
      }
      .phase.is-complete {
        border-color: rgba(107,226,183,.2);
      }
      .phase.is-complete::after {
        border-color: rgba(107,226,183,.55);
        background: var(--ok);
      }
      .phase-header {
        display: grid;
        grid-template-columns: auto minmax(0,1fr) auto;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 22px 24px 22px 26px;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .phase-number {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 18px;
        background: color-mix(in srgb, var(--stage-accent, var(--brand)) 10%, white);
        color: var(--stage-accent, var(--brand));
        font-weight: 700;
      }
      .phase-badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .phase-badge {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text-soft);
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .phase-badge.status-current {
        border-color: color-mix(in srgb, var(--stage-accent, var(--brand)) 22%, white);
        background: color-mix(in srgb, var(--stage-accent, var(--brand)) 10%, white);
        color: var(--stage-accent, var(--brand));
      }
      .phase-badge.status-complete {
        border-color: rgba(107,226,183,.24);
        background: var(--ok-soft);
        color: var(--ok);
      }
      .phase-badge.status-pending {
        border-color: var(--line-strong);
      }
      .phase-title {
        font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
        font-size: clamp(22px,2vw,30px);
        line-height: 1.12;
        letter-spacing: -.04em;
      }
      .phase-subtitle { margin-top: 8px; max-width: 62ch; font-size: 14px; line-height: 1.75; color: var(--text-soft); }
      .phase-status { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 160px; }
      .phase-status strong { font-size: 18px; }
      .phase-status span { font-size: 13px; color: var(--text-soft); }
      .phase-body { display: grid; gap: 18px; padding: 0 24px 24px 26px; }
      .stage-intro, .qa-card, .footer-note {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel-soft);
      }
      .stage-intro {
        padding: 18px 20px;
        background: linear-gradient(180deg, rgba(20,86,255,.04), rgba(255,253,248,.92));
      }
      .stage-intro p, .stage-intro li, .qa-content p, .qa-content li {
        margin: 0;
        line-height: 1.9;
        color: var(--text);
      }
      .stage-intro p + p, .qa-content p + p { margin-top: 12px; }
      .stage-intro ul, .qa-content ul { margin: 12px 0 0; padding-left: 1.2rem; }
      .stage-intro li + li, .qa-content li + li { margin-top: 8px; }
      .qa-list { display: grid; gap: 14px; }
      .qa-card {
        padding: 18px 18px 18px 20px;
        background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(248,245,238,.96));
        transition: 180ms ease;
      }
      .qa-card.remembered {
        border-color: rgba(15,154,114,.24);
        background: linear-gradient(180deg, rgba(15,154,114,.08), rgba(255,255,255,.68));
      }
      .qa-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: start; }
      .qa-index {
        display: grid; place-items: center;
        width: 36px; height: 36px;
        border-radius: 14px;
        background: rgba(18,20,23,.05);
        color: var(--text-soft);
        font-size: 13px; font-weight: 700;
      }
      .qa-tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .qa-tag {
        display: inline-flex; align-items: center;
        min-height: 28px; padding: 0 10px;
        border-radius: 999px;
        background: rgba(18,20,23,.05);
        color: var(--text-soft);
        font-size: 12px;
      }
      .qa-card.remembered .qa-tag.status { background: var(--ok-soft); color: var(--ok); }
      .qa-title {
        margin: 0;
        font-family: "Space Grotesk", "IBM Plex Sans", sans-serif;
        font-size: 22px;
        line-height: 1.45;
        letter-spacing: -.02em;
        color: var(--text);
      }
      .remember-button {
        min-width: 116px; min-height: 44px; padding: 0 14px;
        border-radius: 16px; cursor: pointer; transition: 180ms ease;
        box-shadow: none;
      }
      .remember-button.remembered { border-color: rgba(107,226,183,.26); background: var(--ok-soft); color: var(--ok); }
      .qa-content {
        margin-top: 16px;
        padding-left: 50px;
        color: var(--text);
      }
      .stage-intro strong, .qa-content strong, .footer-note strong {
        color: var(--text);
      }
      .empty-stage {
        padding: 18px;
        border: 1px dashed var(--line-strong);
        border-radius: 20px;
        color: var(--text-soft);
      }
      .footer-note {
        margin-top: 28px;
        padding: 18px 20px;
        color: var(--text-soft);
        line-height: 1.8;
        background: rgba(255,255,255,.76);
      }
      @media (max-width: 980px) {
        .hero { grid-template-columns: 1fr; }
        .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .summary-strip::before { left: 18%; right: 18%; top: 36px; }
        .roadmap { padding-left: 56px; }
        .roadmap::before { left: 22px; }
        .phase::after { left: -42px; }
        .phase-header { grid-template-columns: auto minmax(0, 1fr); }
        .phase-status { grid-column: 1 / -1; align-items: flex-start; margin-left: 64px; min-width: 0; }
        .qa-head { grid-template-columns: auto minmax(0,1fr); }
        .remember-button { grid-column: 2; justify-self: start; }
        .qa-content { padding-left: 0; }
      }
      @media (max-width: 720px) {
        .shell { width: min(100% - 20px, 1200px); padding-top: 18px; }
        .hero, .phase-header, .phase-body { padding-left: 18px; padding-right: 18px; }
        .summary-strip { grid-template-columns: 1fr; }
        .summary-strip::before { display: none; }
        .roadmap { padding-left: 0; }
        .roadmap::before { display: none; }
        .phase::after { display: none; }
        .phase-title { font-size: 22px; }
        .qa-title { font-size: 19px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <div class="eyebrow">Interview Prep Tracker</div>
          <h1>面试备考追踪器</h1>
          <p>按真实面试顺序推进：先开场，再讲项目，最后补通用追问和收尾。每条内容只有两个状态：记住 / 未记住。</p>
          <div class="controls">
            <button class="control-button" data-action="focus-current">继续当前阶段</button>
            <button class="control-button" data-action="toggle-hide">隐藏已记住</button>
            <button class="control-button" data-action="toggle-expand">展开 / 收起全部</button>
            <button class="control-button" data-action="reset">清空记忆状态</button>
          </div>
        </div>
        <div class="hero-panel" id="heroPanel"></div>
      </header>
      <section class="summary-strip" id="summaryStrip"></section>
      <main class="roadmap" id="roadmap"></main>
      <div class="footer-note">只有两种状态：<strong>记住</strong> / <strong>未记住</strong>。不做假的熟练度评级，不做假的准备度推断。什么时候你真的记住了，就点一下。</div>
    </div>

    <script>
      const STORAGE_KEY = "interview-roadmap-tracker/v1";
      const STAGE_ACCENTS = ["#1456ff", "#0f9a72", "#ef7f2d", "#c13ec8"];
      const ROADMAP = [
        {
          id: "opening",
          step: "阶段 1 / 4",
          title: "开场：自我介绍",
          subtitle: "目标不是惊艳，而是让面试官愿意继续往下问。",
          intro: `
            <p>这个部分目标不是“惊艳”，而是让面试官快速知道：</p>
            <ul>
              <li>你是谁</li>
              <li>你现在什么阶段</li>
              <li>你想找什么岗位</li>
              <li>你做过什么</li>
              <li>你为什么值得继续问</li>
            </ul>
          `,
          items: [
            {
              id: "opening-30s",
              kind: "话术",
              title: "30 秒自我介绍版",
              html: `
                <p>面试官您好，我叫端奇，现在是南京工业职业技术大学网络工程专业本科大二。</p>
                <p>我目前主要在找 AI 应用开发、LLM 应用开发，或者全栈偏 AI 方向的实习。</p>
                <p>最近我主要做了两个上线项目，一个是保险场景的 RAG 结构化信息提取系统，另一个是多模型协作式 AI 对话平台。</p>
                <p>我比较关注的是把模型能力真正接到后端服务、数据库、前端交互和部署链路里，而不只是做一个调用模型的 Demo。</p>
                <p>所以我希望找一份能让我继续补强 AI 应用落地和后端工程能力的实习。</p>
              `,
            },
            {
              id: "opening-1m",
              kind: "话术",
              title: "1 分钟自我介绍版",
              html: `
                <p>面试官您好，我叫端奇，现在是南京工业职业技术大学网络工程专业本科大二。</p>
                <p>我目前想找的方向主要是 AI 应用开发、LLM 应用开发，或者全栈偏 AI 的实习岗位。</p>
                <p>我最近主要在做两个项目。</p>
                <p>第一个是保险场景的 RAG 信息提取系统，重点解决结构化输出、结果可追溯和检索可信度的问题；</p>
                <p>第二个是多模型协作式 AI 对话平台，重点做后端服务化、SSE 流式交互和性能优化。</p>
                <p>这两个项目都已经上线，我在里面不仅做了模型接入，也做了接口设计、数据库、评估、日志、健康检查和部署。</p>
                <p>我比较关注的不是单点模型调用，而是怎么把模型能力变成一个真正可用、可验证、可迭代的系统。</p>
                <p>所以我希望通过实习继续补强自己的工程能力，尤其是 AI 应用后端和全链路落地能力。</p>
              `,
            },
            {
              id: "opening-why-direction",
              kind: "问答",
              title: "如果面试官问：“你为什么投这个方向？”",
              html: `
                <p>因为我对“模型能力怎么真正变成产品能力”比较感兴趣。</p>
                <p>我不太满足于只写 prompt 或只做聊天页面，我更想做的是把模型接进检索、后端服务、数据库、前端交互和部署流程里，形成完整的 AI 应用。</p>
                <p>所以我现在会更主动地去做 RAG、多模型协作、流式接口和上线部署这类项目。</p>
              `,
            },
          ],
        },
        {
          id: "insurance-rag",
          step: "阶段 2 / 4",
          title: "项目一：insurance-rag",
          subtitle: "这部分要打出“可信结果、结构化输出、字段引用、评估意识”的标签。",
          intro: `
            <p>这个项目你要打的标签是：</p>
            <ul>
              <li>RAG</li>
              <li>结构化输出</li>
              <li>可信结果</li>
              <li>字段引用</li>
              <li>后端接口</li>
              <li>上线部署</li>
              <li>评估意识</li>
            </ul>
          `,
          items: [
            {
              id: "rag-one-line",
              kind: "一句话",
              title: "一句话介绍项目",
              html: `
                <p>这是一个保险场景下的 RAG 结构化信息提取系统，重点解决普通问答在高可信场景下容易出现幻觉、跨产品污染和结果不可验证的问题。</p>
              `,
            },
            {
              id: "rag-1m",
              kind: "话术",
              title: "1 分钟项目介绍版",
              html: `
                <p>我做的第一个项目是一个保险场景的 RAG 信息提取系统。</p>
                <p>它不是普通聊天问答，而是用户选择某个保险产品后，系统返回结构化的产品信息，比如产品概览、核心保障、免责条款、适用人群等。</p>

      const state = loadState();
      const heroPanel = document.getElementById("heroPanel");
      const summaryStrip = document.getElementById("summaryStrip");
      const roadmapEl = document.getElementById("roadmap");

      function buildDefaultExpanded() {
        const expanded = {};
        ROADMAP.forEach((stage, index) => {
          expanded[stage.id] = index === 0;
        });
        return expanded;
      }

      function loadState() {
        const base = { remembered: {}, expanded: {}, hideRemembered: false };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return base;
          const parsed = JSON.parse(raw);
          return {
            remembered: parsed.remembered && typeof parsed.remembered === "object" ? parsed.remembered : {},
            expanded: parsed.expanded && typeof parsed.expanded === "object" ? parsed.expanded : {},
            hideRemembered: Boolean(parsed.hideRemembered),
          };
        } catch {
          return base;
        }
      }

      function ensureExpandedState() {
        const defaults = buildDefaultExpanded();
        ROADMAP.forEach((stage) => {
          if (typeof state.expanded[stage.id] !== "boolean") {
            state.expanded[stage.id] = defaults[stage.id];
          }
        });
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function allItems() {
        return ROADMAP.flatMap((stage) =>
          stage.items.map((item, index) => ({ ...item, stageId: stage.id, stageTitle: stage.title, index }))
        );
      }

      function stageStats(stage) {
        const remembered = stage.items.filter((item) => Boolean(state.remembered[item.id])).length;
        return { remembered, total: stage.items.length, percent: stage.items.length ? Math.round((remembered / stage.items.length) * 100) : 0 };
      }

      function totalStats() {
        const items = allItems();
        const remembered = items.filter((item) => Boolean(state.remembered[item.id])).length;
        return { remembered, total: items.length, percent: items.length ? Math.round((remembered / items.length) * 100) : 0 };
      }

      function firstUnremembered() {
        return allItems().find((item) => !state.remembered[item.id]) || null;
      }

      function currentStageId() {
        const stage = ROADMAP.find((entry) => stageStats(entry).remembered < entry.items.length);
        return stage ? stage.id : (ROADMAP[ROADMAP.length - 1] && ROADMAP[ROADMAP.length - 1].id);
      }

      function renderHero() {
        const total = totalStats();
        const next = firstUnremembered();
        const currentStage = ROADMAP.find((stage) => stage.id === currentStageId()) || ROADMAP[0];
        const currentStats = currentStage ? stageStats(currentStage) : { remembered: 0, total: 0, percent: 0 };
        const currentIndex = currentStage ? ROADMAP.findIndex((stage) => stage.id === currentStage.id) : 0;
        const accent = STAGE_ACCENTS[currentIndex] || STAGE_ACCENTS[0];

        heroPanel.innerHTML = `
          <div class="panel-card">
            <div class="panel-label">整体准备进度</div>
            <div class="panel-value">${total.remembered} / ${total.total}</div>
            <div class="progress-track"><div class="progress-bar" style="width:${total.percent}%"></div></div>
          </div>
          <div class="panel-card" style="border-color: color-mix(in srgb, ${accent} 26%, white); background: linear-gradient(180deg, color-mix(in srgb, ${accent} 6%, white), var(--panel));">
            <div class="panel-label">当前阶段</div>
            <div class="panel-value" style="font-size:28px; color:${accent}">${currentStage ? currentStage.step : "-"}</div>
            <p style="margin-top:10px">${currentStage ? currentStage.title : "暂无内容"} · 已记住 ${currentStats.remembered}/${currentStats.total}</p>
          </div>
          <div class="panel-card">
            <div class="panel-label">下一条建议</div>
            <div class="panel-value" style="font-size:24px">${next ? next.title : "全部记住了"}</div>
            <p style="margin-top:10px">${next ? next.stageTitle : "可以开始做完整模拟面试了。"}</p>
          </div>
        `;
      }

      function renderSummary() {
        const currentId = currentStageId();
        summaryStrip.innerHTML = ROADMAP.map((stage, index) => {
          const stats = stageStats(stage);
          const isComplete = stats.remembered === stats.total;
          const isCurrent = stage.id === currentId;
          const accent = STAGE_ACCENTS[index] || STAGE_ACCENTS[0];
          return `
            <button class="phase-chip ${isCurrent ? "is-current" : ""} ${isComplete ? "is-complete" : ""}" data-action="jump-stage" data-stage="${stage.id}" style="--stage-accent:${accent}">
              <div class="phase-chip-shell">
                <div class="phase-chip-marker">${index + 1}</div>
                <div class="phase-chip-top">
                  <span class="phase-chip-step">${stage.step}</span>
                  <strong>${stats.remembered}/${stats.total}</strong>
                </div>
                <div class="phase-chip-title">${stage.title}</div>
                <div class="phase-chip-meta">${isComplete ? "已完成" : isCurrent ? "当前阶段" : `${stats.percent}% 已记住`}</div>
                <div class="progress-track" style="margin-top:12px"><div class="progress-bar" style="width:${stats.percent}%"></div></div>
              </div>
            </button>
          `;
        }).join("");
      }

      function renderRoadmap() {
        const currentId = currentStageId();
        roadmapEl.innerHTML = ROADMAP.map((stage, stageIndex) => {
          const stats = stageStats(stage);
          const isOpen = Boolean(state.expanded[stage.id]);
          const isComplete = stats.remembered === stats.total;
          const isCurrent = stage.id === currentId;
          const visibleItems = stage.items.filter((item) => !state.hideRemembered || !state.remembered[item.id]);
          const accent = STAGE_ACCENTS[stageIndex] || STAGE_ACCENTS[0];

          return `
            <section class="phase ${isCurrent ? "is-current" : ""} ${isComplete ? "is-complete" : ""}" id="phase-${stage.id}" style="--stage-accent:${accent}">
              <button class="phase-header" data-action="toggle-stage" data-stage="${stage.id}">
                <div class="phase-number">${stageIndex + 1}</div>
                <div>
                  <div class="phase-badge-row">
                    <span class="phase-badge">${stage.step}</span>
                    <span class="phase-badge ${isComplete ? "status-complete" : isCurrent ? "status-current" : "status-pending"}">
                      ${isComplete ? "已完成" : isCurrent ? "当前阶段" : "待推进"}
                    </span>
                  </div>
                  <div class="phase-title">${stage.title}</div>
                  <div class="phase-subtitle">${stage.subtitle}</div>
                </div>
                <div class="phase-status">
                  <strong>${stats.remembered} / ${stats.total}</strong>
                  <span>${stats.percent}% 已记住 · ${isOpen ? "点击收起" : "点击展开"}</span>
                </div>
              </button>
              ${isOpen ? `
                <div class="phase-body">
                  <div class="stage-intro">${stage.intro}</div>
                  <div class="qa-list">
                    ${
                      visibleItems.length
                        ? visibleItems.map((item, itemIndex) => {
                            const remembered = Boolean(state.remembered[item.id]);
                            return `
                              <article class="qa-card ${remembered ? "remembered" : ""}">
                                <div class="qa-head">
                                  <div class="qa-index">${String(itemIndex + 1).padStart(2, "0")}</div>
                                  <div>
                                    <div class="qa-tag-row">
                                      <span class="qa-tag">${item.kind}</span>
                                      <span class="qa-tag status">${remembered ? "已记住" : "未记住"}</span>
                                    </div>
                                    <h3 class="qa-title">${item.title}</h3>
                                  </div>
                                  <button class="remember-button ${remembered ? "remembered" : ""}" data-action="toggle-item" data-item="${item.id}">
                                    ${remembered ? "已记住" : "标记记住"}
                                  </button>
                                </div>
                                <div class="qa-content">${item.html}</div>
                              </article>
                            `;
                          }).join("")
                        : `<div class="empty-stage">这一阶段当前展示的条目都已经记住了。</div>`
                    }
                  </div>
                </div>
              ` : ""}
            </section>
          `;
        }).join("");
      }

      function renderControls() {
        document.querySelector('[data-action="toggle-hide"]').classList.toggle("active", state.hideRemembered);
      }

      function render() {
        ensureExpandedState();
        renderHero();
        renderSummary();
        renderRoadmap();
        renderControls();
      }

      function toggleItem(itemId) {
        state.remembered[itemId] = !state.remembered[itemId];
        saveState();
        render();
      }

      function toggleStage(stageId) {
        state.expanded[stageId] = !state.expanded[stageId];
        saveState();
        render();
      }

      function jumpToStage(stageId) {
        state.expanded[stageId] = true;
        saveState();
        render();
        requestAnimationFrame(() => {
          document.getElementById(`phase-${stageId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }

      function focusCurrentStage() {
        const id = currentStageId();
        if (id) jumpToStage(id);
      }

      function toggleHideRemembered() {
        state.hideRemembered = !state.hideRemembered;
        saveState();
        render();
      }

      function toggleExpandAll() {
        const shouldExpand = !ROADMAP.every((stage) => Boolean(state.expanded[stage.id]));
        ROADMAP.forEach((stage) => {
          state.expanded[stage.id] = shouldExpand;
        });
        saveState();
        render();
      }

      function resetAll() {
        if (!window.confirm("确定要清空所有“已记住”状态吗？")) return;
        state.remembered = {};
        state.expanded = buildDefaultExpanded();
        state.hideRemembered = false;
        saveState();
        render();
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "toggle-item") toggleItem(target.dataset.item);
        if (action === "toggle-stage") toggleStage(target.dataset.stage);
        if (action === "jump-stage") jumpToStage(target.dataset.stage);
        if (action === "focus-current") focusCurrentStage();
        if (action === "toggle-hide") toggleHideRemembered();
        if (action === "toggle-expand") toggleExpandAll();
        if (action === "reset") resetAll();
      });

      render();
    </script>
  </body>
</html>
